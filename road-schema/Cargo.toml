[package]
name = "mapshow-road-schema"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "Rust replacement for Mapshow's simulation-oriented OpenStreetMap road preprocessing"

[lib]
name = "mapshow_road_schema"
path = "src/lib.rs"

[[bin]]
name = "mapshow-roadgen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
osmpbf = "0.3"
pmtiles = { version = "0.24", default-features = false, features = ["write"] }
prost = { version = "0.14.4", default-features = false, features = ["derive"] }
redb = "4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"
