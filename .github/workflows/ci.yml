name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check local road presets helper
        run: npm run roads:build -- --list

      - name: Run browser unit tests
        run: npm test

      - name: Build
        run: npm run build

  road-schema-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: road-schema -> target

      - name: Check Rust formatting
        run: cargo fmt --manifest-path road-schema/Cargo.toml --all -- --check

      - name: Compile and test Rust game-road generator
        run: cargo test --manifest-path road-schema/Cargo.toml --all-targets

      - name: Download small real OSM extract
        run: curl -fsSL --retry 3 https://download.geofabrik.de/europe/monaco-latest.osm.pbf -o /tmp/monaco.osm.pbf

      - name: Build real XYZ MVT smoke output
        run: |
          cargo run --manifest-path road-schema/Cargo.toml -- \
            build-xyz \
            --input /tmp/monaco.osm.pbf \
            --output-dir /tmp/game-roads \
            --tile-url-template 'https://example.invalid/game-roads/{z}/{x}/{y}.pbf'
          test -s /tmp/game-roads/tilejson.json
          test -n "$(find /tmp/game-roads -name '*.pbf' -type f -size +0c -print -quit)"

      - name: Build real PMTiles smoke output
        run: |
          cargo run --manifest-path road-schema/Cargo.toml -- \
            build-pmtiles \
            --input /tmp/monaco.osm.pbf \
            --output /tmp/game-roads.pmtiles
          test -s /tmp/game-roads.pmtiles

  visual-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: road-schema -> target

      - name: Install dependencies
        run: npm install

      - name: Confirm system Chrome
        run: |
          (google-chrome --version || google-chrome-stable --version || chromium --version || chromium-browser --version)

      - name: Build Adelaide simulation roads
        run: npm run roads:build -- adelaide

      - name: Start local roads mode
        run: |
          npm run dev:roads -- --host 127.0.0.1 > /tmp/mapshow-vite.log 2>&1 &
          echo $! > /tmp/mapshow-vite.pid
          for attempt in $(seq 1 60); do
            pid="$(cat /tmp/mapshow-vite.pid)"
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Vite exited before becoming ready"
              cat /tmp/mapshow-vite.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then
              cat /tmp/mapshow-vite.log
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for Vite"
          cat /tmp/mapshow-vite.log
          exit 1

      - name: Verify actual canvas rendering
        run: npm run test:visual

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapshow-visual-rendering
          path: /tmp/mapshow-visual/
          if-no-files-found: warn

      - name: Stop local server
        if: always()
        run: |
          if test -f /tmp/mapshow-vite.pid; then
            kill "$(cat /tmp/mapshow-vite.pid)" || true
          fi
